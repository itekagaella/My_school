services:
  db:
    image: postgres:16-alpine
    container_name: myschool_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: my_school
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      # Le script d'initialisation est exécuté UNIQUEMENT au premier démarrage
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"   # 5433 pour ne pas entrer en conflit avec un Postgres local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_school"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    container_name: myschool_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Variables lues par config/database.php
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: my_school
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      # Montage du code pour développement sans rebuild
      - ./:/var/www/html
    # Le montage ci-dessus masque le chown fait dans le Dockerfile : Apache
    # tourne en www-data et ne peut alors plus écrire dans assets/uploads
    # (« Impossible de stocker le fichier » à l'upload). On recrée donc les
    # dossiers attendus et on les rend accessibles à chaque démarrage.
    command:
      - bash
      - -c
      - |
        mkdir -p /var/www/html/assets/uploads/{documents,avatars,clubs,admin,backups}
        chmod -R 0777 /var/www/html/assets/uploads
        exec apache2-foreground
    ports:
      - "8081:80"
    networks:
      default:

volumes:
  db_data:
